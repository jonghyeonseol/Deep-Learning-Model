# Default Configuration for Proteomics Deep Learning

# Data settings
data:
  format: "mzml"  # raw, mzml, csv, auto
  mz_range: [50.0, 2000.0]
  bin_size: 0.1
  normalization: "tic"  # tic, max, sqrt, none
  ms_level: 2
  min_peaks: 5
  cache_dir: "./data/proteomics/processed"

# Model settings
model:
  architecture: "cnn"  # cnn, transformer, rt_predictor, multitask
  task: "classification"  # classification, regression

  # CNN settings
  cnn:
    num_conv_layers: 5
    conv_channels: [32, 64, 128, 256, 512]
    kernel_size: 5
    dropout: 0.3
    use_residual: true

  # Transformer settings
  transformer:
    d_model: 256
    nhead: 8
    num_encoder_layers: 4
    dim_feedforward: 1024
    dropout: 0.1

# Training settings
training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"  # adam, sgd, adamw
  scheduler: "step"  # step, plateau, cosine, none
  scheduler_params:
    step_size: 10
    gamma: 0.1
  loss_function: "cross_entropy"  # cross_entropy, mse, focal, spectral_angle
  patience: 10  # early stopping
  use_amp: true  # automatic mixed precision
  num_workers: 4
  device: "auto"  # auto, cuda, cpu, mps

# Checkpoint settings
checkpoint:
  dir: "./checkpoints/proteomics"
  save_best_only: true
  save_frequency: 5  # epochs

# Logging
logging:
  level: "INFO"
  save_history: true
  plot_frequency: 5  # epochs
